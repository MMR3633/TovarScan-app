<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>AI-Аналитик ниши</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #07080d;
    --text: #e9ecf5;
    --muted: #8a90a6;
    --muted2: #707892;
    --muted3: #565d75;
    --teal: #00e5d1;
    --purple: #7c5cff;
    --blue: #2ad4ff;
    --green: #1fe084;
    --yellow: #ffc24b;
    --orange: #ff8a3d;
    --red: #ff5a6e;
    --card: rgba(18,21,32,.85);
    --line: rgba(255,255,255,.07);
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', system-ui, sans-serif;
  }
  html, body { background: var(--bg); }
  body {
    font-family: var(--sans);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: var(--sans); }
  .nq-scroll::-webkit-scrollbar { width: 0; }

  @keyframes nq-grid-pan { from { background-position: 0 0; } to { background-position: 44px 44px; } }
  @keyframes nq-spin { to { transform: rotate(360deg); } }
  @keyframes nq-pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  @keyframes nq-bar { from { width: 0; } }
  @keyframes nq-grow { from { transform: scaleY(0); } }
  @keyframes nq-pop { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes nq-fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes nq-slide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
  @keyframes nq-dash { to { stroke-dashoffset: 0; } }
  @keyframes nq-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .nq-root {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(circle at 18% 0%, rgba(0,229,209,.10), transparent 42%),
      radial-gradient(circle at 88% 8%, rgba(124,92,255,.14), transparent 46%),
      var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .nq-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 44px 44px;
    animation: nq-grid-pan 9s linear infinite;
    pointer-events: none;
    -webkit-mask-image: linear-gradient(180deg, #000, transparent 78%);
    mask-image: linear-gradient(180deg, #000, transparent 78%);
  }
  .nq-frame {
    width: 100%; max-width: 460px;
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    min-height: 100vh; min-height: 100dvh;
  }

  .nq-label {
    font-size: 11px; color: var(--muted2);
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 1.5px;
  }
  .nq-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
  }
  .nq-btn-primary {
    width: 100%; border: none; cursor: pointer; border-radius: 14px;
    padding: 16px; font-size: 15px; font-weight: 600; color: #07080d;
    background: linear-gradient(135deg, #00e5d1, #2ad4ff);
    box-shadow: 0 10px 30px -8px rgba(0,229,209,.55);
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: filter .15s, transform .1s;
  }
  .nq-btn-primary:hover { filter: brightness(1.08); }
  .nq-btn-primary:active { transform: translateY(1px); }
  .nq-btn-ghost {
    width: 100%; border: 1px solid rgba(0,229,209,.35); cursor: pointer;
    border-radius: 14px; padding: 14px; font-size: 14px; font-weight: 600;
    color: var(--teal); background: rgba(0,229,209,.06);
    display: flex; align-items: center; justify-content: center; gap: 9px;
    transition: background .15s, transform .1s;
  }
  .nq-btn-ghost:hover { background: rgba(0,229,209,.12); }
  .nq-btn-ghost:active { transform: translateY(1px); }

  .fade { animation: nq-fadein .35s ease; }
  .slide { animation: nq-slide .35s ease; }
</style>
</head>
<body>
<div class="nq-root">
  <div class="nq-grid"></div>
  <div class="nq-frame" id="app"></div>
</div>

<script>
const AUTHOR = "Иван Аналитик";

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
function haptic(type) {
  try {
    if (!tg) return;
    if (type === 'impact') tg.HapticFeedback.impactOccurred('medium');
    else if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else tg.HapticFeedback.selectionChanged();
  } catch (e) {}
}
if (tg) {
  try {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#07080d');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#07080d');
  } catch (e) {}
}

const state = {
  screen: 'onboarding',
  query: '',
  result: null,
  loadingMsg: '',
  history: [],
  proActive: false,
};
let _timer = null;

const onboardFeatures = [
  { icon: '⚡', title: 'Анализ за 2 секунды', sub: 'Спрос, конкуренция, цена', tint: 'rgba(0,229,209,.14)' },
  { icon: '🎯', title: 'Чёткий вердикт', sub: 'Заходить в нишу или нет', tint: 'rgba(124,92,255,.16)' },
  { icon: '📊', title: 'Графики и конкуренты', sub: 'Тренды, сезонность, топ-селлеры', tint: 'rgba(42,212,255,.14)' },
];
const proFeatures = [
  'Безлимитные анализы ниш',
  'Юнит-экономика и расчёт прибыли',
  'Контакты проверенных поставщиков',
  'Прогноз продаж на 6 месяцев',
  'Экспорт отчётов в PDF',
];
const examples = [
  { emoji: '📱', title: 'Чехлы для iPhone', hint: 'Аксессуары · высокий оборот', tint: 'rgba(0,229,209,.14)' },
  { emoji: '💡', title: 'Светильники', hint: 'Дом и интерьер', tint: 'rgba(124,92,255,.16)' },
  { emoji: '🧸', title: 'Детские игрушки', hint: 'Сезонный спрос', tint: 'rgba(42,212,255,.14)' },
];

const NAV_ICONS = {
  analyze: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9 9 0 0 0-9 9"/><path d="M3 3v5h5"/><path d="M12 7v5l3 3"/></svg>',
  pro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 17l-5.5 2.5 1-6.3L3 8.9 9 8z"/></svg>',
  profile: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
};
const LOGO_SVG = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#07080d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>';

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function generate(q) {
  const r = () => Math.floor(Math.random() * 3);
  const dLvl = r(), cLvl = r();
  const demandM = [
    { label: 'Низкий', color: '#ff5a6e', pct: '28%' },
    { label: 'Средний', color: '#ffc24b', pct: '60%' },
    { label: 'Высокий', color: '#1fe084', pct: '88%' },
  ];
  const compM = [
    { label: 'Низкая', color: '#1fe084', pct: '30%' },
    { label: 'Средняя', color: '#ffc24b', pct: '58%' },
    { label: 'Высокая', color: '#ff5a6e', pct: '85%' },
  ];
  const demand = demandM[dLvl];
  const competition = compM[cLvl];
  const price = ((Math.floor(Math.random() * 36) + 7) * 100 + Math.floor(Math.random() * 10) * 10);

  const score = dLvl - cLvl;
  let verdict, scoreIcon;
  if (score >= 1) {
    verdict = { tag: 'ЗАХОДИТЬ', color: '#1fe084', bg: 'rgba(31,224,132,.14)',
      text: `Ниша «${q}» выглядит перспективно: спрос ${demand.label.toLowerCase()}, а конкуренция ${competition.label.toLowerCase()}. Хороший момент для входа — делай ставку на качество карточки и отзывы в первые 2 недели.` };
    scoreIcon = '↑';
  } else if (score <= -1) {
    verdict = { tag: 'РИСКОВАННО', color: '#ff5a6e', bg: 'rgba(255,90,110,.14)',
      text: `Ниша «${q}» перегрета: конкуренция ${competition.label.toLowerCase()} при спросе ${demand.label.toLowerCase()}. Заходить без сильного УТП или демпинга не стоит — рекомендую сузить до подкатегории.` };
    scoreIcon = '↓';
  } else {
    verdict = { tag: 'С УМОМ', color: '#ffc24b', bg: 'rgba(255,194,75,.14)',
      text: `Ниша «${q}» неоднозначная: спрос ${demand.label.toLowerCase()}, конкуренция ${competition.label.toLowerCase()}. Тестируй малой партией и считай юнит-экономику — потенциал есть, но запас прочности небольшой.` };
    scoreIcon = '≈';
  }

  const sellers = (Math.floor(Math.random() * 900) + 120);
  const revenue = (Math.floor(Math.random() * 90) + 12);
  const margin = (Math.floor(Math.random() * 35) + 18);
  const kpis = [
    { value: sellers, label: 'продавцов', color: '#e9ecf5' },
    { value: revenue + ' млн', label: 'выручка ниши', color: '#00e5d1' },
    { value: margin + '%', label: 'ср. маржа', color: '#1fe084' },
  ];

  const base = 25 + dLvl * 18;
  const pts = [];
  let v = base;
  for (let m = 0; m < 12; m++) {
    v += (Math.random() - 0.42) * 16;
    v = Math.max(8, Math.min(80, v));
    pts.push(v);
  }
  const W = 300, H = 90, pad = 6;
  const toXY = (val, idx) => {
    const x = pad + (idx / 11) * (W - pad * 2);
    const y = H - pad - (val / 90) * (H - pad * 2);
    return [x, y];
  };
  const lineCoords = pts.map((p, i) => toXY(p, i));
  const trendLine = lineCoords.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  const trendArea = `${pad},${H} ` + trendLine + ` ${W - pad},${H}`;
  const trendUp = pts[11] >= pts[0];
  const trendPct = Math.round(Math.abs((pts[11] - pts[0]) / pts[0]) * 100);
  const trendDir = (trendUp ? '▲ +' : '▼ −') + trendPct + '%';
  const trendDirColor = trendUp ? '#1fe084' : '#ff5a6e';

  const months = ['Я','Ф','М','А','М','И','И','А','С','О','Н','Д'];
  const season = months.map((m, i) => {
    const hv = Math.floor(Math.random() * 60) + 35;
    const hot = hv > 75;
    return { m, h: hv + '%', color: hot ? '#00e5d1' : 'rgba(124,92,255,.55)', delay: (i * 0.04).toFixed(2) + 's' };
  });

  const brands = ['MarketPro', 'TopSeller', 'NeoShop', 'PrimeGoods', 'UltraStore', 'FlexMart', 'GoodsLab'];
  const shuffled = brands.slice().sort(() => Math.random() - 0.5).slice(0, 4);
  let shareLeft = 100;
  const competitors = shuffled.map((name, i) => {
    const s = i === 3 ? shareLeft : Math.floor(Math.random() * (shareLeft / 2)) + 12;
    shareLeft -= s;
    return { rank: i + 1, name, share: Math.max(15, s) + '%', sales: (Math.floor(Math.random() * 4000) + 400).toLocaleString('ru-RU') };
  });

  return {
    title: q, demand, competition,
    price: price.toLocaleString('ru-RU'),
    verdict, scoreIcon,
    kpis, trendLine, trendArea, trendDir, trendDirColor,
    season, competitors,
  };
}

function setScreen(screen) { state.screen = screen; render(); }

function analyze(preset) {
  const q = (typeof preset === 'string' ? preset : state.query).trim();
  if (!q) return;
  haptic('impact');
  state.query = q;
  state.screen = 'loading';
  render();

  const msgs = ['Сбор данных маркетплейсов…', 'Оценка конкурентов…', 'Расчёт юнит-экономики…', 'Формирую вердикт…'];
  let i = 0;
  state.loadingMsg = msgs[0];
  updateLoadingMsg();
  clearInterval(_timer);
  _timer = setInterval(() => {
    i++;
    if (i < msgs.length) { state.loadingMsg = msgs[i]; updateLoadingMsg(); }
  }, 420);

  setTimeout(() => {
    clearInterval(_timer);
    const result = generate(q);
    state.result = result;
    state.history = [result, ...state.history.filter(h => h.title !== result.title)].slice(0, 12);
    state.screen = 'result';
    haptic('success');
    render();
  }, 1850);
}
function updateLoadingMsg() {
  const el = document.getElementById('nq-loadmsg');
  if (el) el.textContent = state.loadingMsg;
}
function reset() { state.query = ''; state.result = null; state.screen = 'input'; render(); }
function activatePro() { state.proActive = true; haptic('success'); render(); }
function openHistory(idx) { state.result = state.history[idx]; state.screen = 'result'; render(); }

function topMeta() {
  const map = {
    input:   ['AI-Аналитик ниши', 'neural scan · готов'],
    loading: ['AI-Аналитик ниши', 'идёт анализ…'],
    result:  ['Результат анализа', 'отчёт готов'],
    details: ['Глубокий разбор', 'детальный отчёт'],
    history: ['История', 'сохранённые ниши'],
    pro:     ['Подписка PRO', 'апгрейд аккаунта'],
    profile: ['Профиль', 'аккаунт и настройки'],
  };
  return map[state.screen] || map.input;
}
function navConfig() {
  const s = state.screen;
  const analyzeActive = ['input', 'loading', 'result', 'details'].includes(s);
  return [
    { key: 'analyze', label: 'Анализ',  active: analyzeActive,   icon: NAV_ICONS.analyze, screen: 'input' },
    { key: 'history', label: 'История', active: s === 'history', icon: NAV_ICONS.history, screen: 'history' },
    { key: 'pro',     label: 'PRO',     active: s === 'pro',     icon: NAV_ICONS.pro,     screen: 'pro' },
    { key: 'profile', label: 'Профиль', active: s === 'profile', icon: NAV_ICONS.profile, screen: 'profile' },
  ];
}

function poweredBy() {
  return `<span style="font-size:11px;color:var(--muted3);font-family:var(--mono);">Powered by </span>
    <span style="font-size:11px;font-weight:700;font-family:var(--mono);background:linear-gradient(90deg,#00e5d1,#7c5cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">${esc(AUTHOR)}</span>`;
}

function screenOnboarding() {
  const features = onboardFeatures.map(f => `
    <div style="display:flex;align-items:center;gap:13px;text-align:left;background:rgba(18,21,32,.7);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:13px 15px;">
      <span style="width:38px;height:38px;flex:none;border-radius:11px;background:${f.tint};display:flex;align-items:center;justify-content:center;font-size:18px;">${f.icon}</span>
      <span>
        <span style="display:block;font-size:14px;font-weight:600;">${esc(f.title)}</span>
        <span style="display:block;font-size:12px;color:var(--muted2);margin-top:1px;">${esc(f.sub)}</span>
      </span>
    </div>`).join('');

  return `
  <div class="fade" style="flex:1;display:flex;flex-direction:column;padding:30px 22px 26px;">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
      <div style="width:96px;height:96px;border-radius:26px;background:linear-gradient(135deg,#00e5d1,#7c5cff);display:flex;align-items:center;justify-content:center;box-shadow:0 0 50px rgba(0,229,209,.45);animation:nq-float 4s ease infinite;margin-bottom:30px;">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#07080d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l3-4 3 3 4-6"/></svg>
      </div>
      <h1 style="font-size:33px;font-weight:700;line-height:1.1;letter-spacing:-.6px;margin-bottom:14px;">AI-Аналитик<br>ниши</h1>
      <p style="font-size:15px;color:var(--muted);line-height:1.55;max-width:320px;">Проверь любую категорию товара за 2 секунды: спрос, конкуренция, рекомендованная цена и вердикт нейросети — стоит ли заходить.</p>
      <div style="display:flex;flex-direction:column;gap:12px;width:100%;margin-top:34px;">${features}</div>
    </div>
    <button data-act="start" class="nq-btn-primary" style="border-radius:15px;padding:17px;font-size:16px;background:linear-gradient(135deg,#00e5d1,#2ad4ff);box-shadow:0 12px 34px -8px rgba(0,229,209,.55);margin-top:26px;">Начать анализ</button>
    <div style="text-align:center;margin-top:14px;">${poweredBy()}</div>
  </div>`;
}

function screenInput() {
  const exs = examples.map(ex => `
    <button data-act="example" data-q="${esc(ex.title)}" style="text-align:left;cursor:pointer;background:rgba(18,21,32,.75);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 15px;display:flex;align-items:center;gap:13px;transition:border-color .2s,transform .15s;">
      <span style="width:40px;height:40px;flex:none;border-radius:11px;background:${ex.tint};display:flex;align-items:center;justify-content:center;font-size:20px;">${ex.emoji}</span>
      <span style="flex:1;">
        <span style="display:block;font-size:14.5px;font-weight:600;color:var(--text);">${esc(ex.title)}</span>
        <span style="display:block;font-size:12px;color:var(--muted2);margin-top:2px;">${esc(ex.hint)}</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e5d1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>`).join('');

  return `
  <div class="fade">
    <div style="margin-bottom:20px;">
      <h1 style="font-size:27px;font-weight:700;line-height:1.14;letter-spacing:-.5px;margin-bottom:8px;">Какую нишу<br>проверим?</h1>
      <p style="font-size:13.5px;color:var(--muted);line-height:1.5;">Введи категорию — нейросеть оценит спрос, конкуренцию и подскажет цену.</p>
    </div>
    <label class="nq-label" style="margin-bottom:9px;display:block;">Категория товара</label>
    <div style="position:relative;margin-bottom:14px;">
      <input id="nq-query" placeholder="напр. беспроводные наушники" value="${esc(state.query)}"
        style="width:100%;background:rgba(20,23,34,.85);border:1px solid rgba(0,229,209,.28);border-radius:14px;padding:16px;font-size:15px;color:var(--text);font-family:var(--sans);outline:none;">
    </div>
    <button data-act="analyze" class="nq-btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#07080d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l14 9-14 9V3z"/></svg>
      Анализировать
    </button>
    <div class="nq-label" style="margin-top:26px;margin-bottom:12px;">Популярные запросы</div>
    <div style="display:flex;flex-direction:column;gap:10px;">${exs}</div>
  </div>`;
}

function screenLoading() {
  return `
  <div class="fade" style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
    <div style="position:relative;width:92px;height:92px;margin-bottom:28px;">
      <div style="position:absolute;inset:0;border-radius:50%;border:2px solid rgba(0,229,209,.15);border-top-color:#00e5d1;animation:nq-spin 1s linear infinite;"></div>
      <div style="position:absolute;inset:14px;border-radius:50%;border:2px solid rgba(124,92,255,.15);border-bottom-color:#7c5cff;animation:nq-spin 1.4s linear infinite reverse;"></div>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;">🧠</div>
    </div>
    <div style="font-size:17px;font-weight:600;margin-bottom:8px;">Сканирую нишу «${esc(state.query)}»</div>
    <div id="nq-loadmsg" style="font-size:13px;color:var(--muted2);font-family:var(--mono);animation:nq-pulse 1.3s ease infinite;">${esc(state.loadingMsg)}</div>
  </div>`;
}

function metricCard(title, m, delay) {
  return `
  <div style="background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;animation:nq-pop .45s ease both;animation-delay:${delay};position:relative;overflow:hidden;">
    <div style="position:absolute;top:0;left:0;right:0;height:2px;background:${m.color};"></div>
    <div style="font-size:11px;color:var(--muted2);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">${title}</div>
    <div style="display:flex;align-items:baseline;gap:8px;">
      <span style="width:10px;height:10px;border-radius:50%;background:${m.color};box-shadow:0 0 12px ${m.color};"></span>
      <span style="font-size:20px;font-weight:700;">${m.label}</span>
    </div>
    <div style="height:6px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden;">
      <div style="height:100%;border-radius:4px;width:${m.pct};background:${m.color};animation:nq-bar 1s ease;"></div>
    </div>
  </div>`;
}

function screenResult() {
  const r = state.result;
  if (!r) return screenInput();
  return `
  <div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;animation:nq-pop .4s ease both;">
      <span class="nq-label">Сводка по нише</span>
      <span style="flex:1;height:1px;background:linear-gradient(90deg,rgba(0,229,209,.4),transparent);"></span>
    </div>
    <div style="font-size:22px;font-weight:700;margin-bottom:18px;animation:nq-pop .4s ease both;animation-delay:.04s;">${esc(r.title)}</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;">
      ${metricCard('Спрос', r.demand, '.08s')}
      ${metricCard('Конкуренция', r.competition, '.14s')}
    </div>

    <div style="background:linear-gradient(135deg,rgba(0,229,209,.12),rgba(124,92,255,.12));border:1px solid rgba(0,229,209,.3);border-radius:16px;padding:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;animation:nq-pop .45s ease both;animation-delay:.2s;">
      <div>

        <div style="font-size:28px;font-weight:700;color:#fff;letter-spacing:-.5px;">${esc(r.price)} ₽</div>
      </div>
      <div style="width:46px;height:46px;border-radius:13px;background:rgba(0,229,209,.18);display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00e5d1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1v22M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>

    <div style="background:var(--card);border:1px solid rgba(124,92,255,.3);border-radius:16px;padding:17px;margin-bottom:14px;animation:nq-pop .45s ease both;animation-delay:.26s;">

      Подробный разбор
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#07080d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>

function screenDetails() {
  const r = state.result;
  if (!r) return screenInput();
  const kpis = r.kpis.map(k => `
    <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 11px;text-align:center;animation:nq-pop .4s ease both;">
      <div style="font-size:17px;font-weight:700;color:${k.color};">${esc(k.value)}</div>
      <div style="font-size:10px;color:var(--muted2);font-family:var(--mono);text-transform:uppercase;letter-spacing:.5px;margin-top:4px;line-height:1.3;">${esc(k.label)}</div>
    </div>`).join('');

  const season = r.season.map(s => `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;height:100%;">
      <div style="width:100%;border-radius:3px 3px 0 0;height:${s.h};background:${s.color};transform-origin:bottom;animation:nq-grow .6s ease both;animation-delay:${s.delay};"></div>
      <span style="font-size:8.5px;color:var(--muted3);font-family:var(--mono);">${s.m}</span>
    </div>`).join('');

  const comps = r.competitors.map(c => `
    <div style="display:flex;align-items:center;gap:12px;">
      <span style="width:24px;height:24px;flex:none;border-radius:8px;background:rgba(124,92,255,.18);color:#b9a8ff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono);">${c.rank}</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:600;">${esc(c.name)}</div>
        <div style="height:5px;border-radius:3px;background:rgba(255,255,255,.06);margin-top:5px;overflow:hidden;">
          <div style="height:100%;border-radius:3px;width:${c.share};background:linear-gradient(90deg,#7c5cff,#2ad4ff);animation:nq-bar 1s ease;"></div>
        </div>
      </div>
      <div style="text-align:right;flex:none;">
        <div style="font-size:12.5px;font-weight:700;">${esc(c.sales)}</div>
        <div style="font-size:10px;color:var(--muted2);font-family:var(--mono);">продаж/мес</div>
      </div>
    </div>`).join('');

  return `
  <div class="slide">
    <button data-act="back-result" style="cursor:pointer;background:none;border:none;color:var(--muted2);font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:6px;margin-bottom:14px;padding:0;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      Назад к сводке
    </button>
    <div style="font-size:22px;font-weight:700;margin-bottom:4px;">${esc(r.title)}</div>
    <div style="font-size:13px;color:var(--muted2);margin-bottom:20px;">Глубокий разбор ниши</div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:16px;">${kpis}</div>

    <div class="nq-card" style="padding:17px;margin-bottom:12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <span style="font-size:12px;font-weight:600;">Динамика спроса · 12 мес</span>
        <span style="font-size:11px;font-weight:700;color:${r.trendDirColor};font-family:var(--mono);">${esc(r.trendDir)}</span>
      </div>
      <svg viewBox="0 0 300 90" preserveAspectRatio="none" style="width:100%;height:90px;display:block;">
        <defs>
          <linearGradient id="nqfill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#00e5d1" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#00e5d1" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <polygon points="${r.trendArea}" fill="url(#nqfill)"></polygon>
        <polyline points="${r.trendLine}" fill="none" stroke="#00e5d1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="600" stroke-dashoffset="600" style="animation:nq-dash 1.4s ease forwards;"></polyline>
      </svg>
    </div>

    <div class="nq-card" style="padding:17px;margin-bottom:12px;">
      <div style="font-size:12px;font-weight:600;margin-bottom:14px;">Сезонность продаж</div>
      <div style="display:flex;align-items:flex-end;gap:5px;height:64px;">${season}</div>
    </div>

    <div class="nq-card" style="padding:17px;margin-bottom:14px;">
      <div style="font-size:12px;font-weight:600;margin-bottom:14px;">Топ конкурентов</div>
      <div style="display:flex;flex-direction:column;gap:11px;">${comps}</div>
    </div>

    <div data-act="pro" style="cursor:pointer;background:linear-gradient(135deg,rgba(255,194,75,.12),rgba(124,92,255,.1));border:1px solid rgba(255,194,75,.3);border-radius:16px;padding:16px;display:flex;align-items:center;gap:13px;">
      <span style="font-size:24px;">🔒</span>
      <div style="flex:1;">
        <div style="font-size:13.5px;font-weight:700;color:#ffc24b;">Юнит-экономика и поставщики</div>
        <div style="font-size:12px;color:#9aa0b4;margin-top:2px;">Расчёт прибыли, налогов и логистики — в PRO</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffc24b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>`;
}

function screenHistory() {
  let body;
  if (state.history.length === 0) {
    body = `
    <div style="text-align:center;padding:50px 20px;color:var(--muted3);">
      <div style="font-size:40px;margin-bottom:14px;opacity:.6;">🗂️</div>
      <div style="font-size:14px;color:var(--muted);margin-bottom:18px;">Пока пусто. Проанализируй первую нишу.</div>
      <button data-act="go" data-screen="input" style="cursor:pointer;border:1px solid rgba(0,229,209,.4);background:rgba(0,229,209,.08);color:#00e5d1;font-weight:600;font-size:13.5px;padding:11px 22px;border-radius:12px;">Начать анализ</button>
    </div>`;
  } else {
    const items = state.history.map((h, idx) => `
      <button data-act="open-history" data-idx="${idx}" style="text-align:left;cursor:pointer;background:rgba(18,21,32,.78);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 15px;display:flex;align-items:center;gap:13px;">
        <span style="width:42px;height:42px;flex:none;border-radius:11px;background:${h.verdict.bg};color:${h.verdict.color};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;">${h.scoreIcon}</span>
        <span style="flex:1;min-width:0;">
          <span style="display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(h.title)}</span>
          <span style="display:flex;gap:10px;margin-top:4px;">
            <span style="font-size:11px;color:${h.demand.color};font-family:var(--mono);">спрос: ${h.demand.label}</span>
            <span style="font-size:11px;color:${h.competition.color};font-family:var(--mono);">конк: ${h.competition.label}</span>
          </span>
        </span>
        <span style="font-size:13px;font-weight:700;color:#fff;flex:none;">${esc(h.price)} ₽</span>
      </button>`).join('');
    body = `<div style="display:flex;flex-direction:column;gap:10px;">${items}</div>`;
  }
  return `
  <div class="fade">
    <h1 style="font-size:24px;font-weight:700;margin-bottom:4px;">История анализов</h1>
    <p style="font-size:13px;color:var(--muted);margin-bottom:20px;">Все ниши, что ты проверял</p>
    ${body}
  </div>`;
}

  return `
  <div class="fade">

      <p style="font-size:13.5px;color:var(--muted);line-height:1.5;max-width:320px;margin:0 auto;">Безлимит анализов и полная картина по нише — данные, на которые опираются ТОП-селлеры.</p>
    </div>

    <div style="background:rgba(18,21,32,.8);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;">${feats}</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
      <div style="background:rgba(18,21,32,.8);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px;text-align:center;">
        <div style="font-size:12px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;">Месяц</div>
        <div style="font-size:26px;font-weight:700;margin:8px 0 2px;">490 ₽</div>
        <div style="font-size:11px;color:var(--muted2);">в месяц</div>
      </div>
      <div style="background:linear-gradient(135deg,rgba(255,194,75,.14),rgba(255,138,61,.1));border:1.5px solid rgba(255,194,75,.5);border-radius:16px;padding:16px;text-align:center;position:relative;">
        <div style="position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:#ffc24b;color:#07080d;font-size:9px;font-weight:700;font-family:var(--mono);padding:3px 9px;border-radius:20px;letter-spacing:.5px;">−58%</div>
        <div style="font-size:12px;color:#ffc24b;font-family:var(--mono);text-transform:uppercase;letter-spacing:1px;">Год</div>
        <div style="font-size:26px;font-weight:700;margin:8px 0 2px;color:#fff;">2 490 ₽</div>
        <div style="font-size:11px;color:#c7a85a;">≈ 207 ₽/мес</div>

    <button data-act="activate-pro" class="nq-btn-primary" style="background:linear-gradient(135deg,#ffc24b,#ff8a3d);box-shadow:0 12px 32px -8px rgba(255,194,75,.5);font-weight:700;">${state.proActive ? '✓ PRO активирован' : 'Оформить PRO'}</button>
    <div style="text-align:center;font-size:11px;color:var(--muted3);margin-top:10px;font-family:var(--mono);">Отписаться можно в любой момент</div>
  </div>`;

function screenProfile() {
  const goodCount = state.history.filter(h => h.verdict.tag === 'ЗАХОДИТЬ').length;
  const initial = (AUTHOR.trim()[0] || 'A').toUpperCase();
  const planLabel = state.proActive ? '★ PRO подписка активна' : 'Бесплатный план';
  const planColor = state.proActive ? '#ffc24b' : '#707892';

  const settings = [
    { icon: '👤', label: 'Имя профиля', value: AUTHOR, act: '' },
    { icon: '🔔', label: 'Уведомления', value: 'Вкл', act: '' },
    { icon: state.proActive ? '★' : '🔓', label: 'Подписка', value: state.proActive ? 'PRO' : 'Free', act: 'pro' },
    { icon: '❓', label: 'Помощь и поддержка', value: '', act: '' },
  ];
  const rows = settings.map(s => `
    <div ${s.act ? `data-act="${s.act}"` : ''} style="display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid rgba(255,255,255,.05);cursor:${s.act ? 'pointer' : 'default'};">
      <span style="font-size:17px;width:24px;text-align:center;">${s.icon}</span>
      <span style="flex:1;font-size:14px;color:#d6dae8;">${esc(s.label)}</span>
      <span style="font-size:12px;color:var(--muted2);">${esc(s.value)}</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#565d75" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>`).join('');

  return `
  <div class="fade">
    <div style="display:flex;align-items:center;gap:15px;margin-bottom:22px;">
      <div style="width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#00e5d1,#7c5cff);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#07080d;box-shadow:0 0 28px rgba(0,229,209,.35);">${initial}</div>
      <div>
        <div style="font-size:19px;font-weight:700;">${esc(AUTHOR)}</div>
        <div style="font-size:12px;color:${planColor};font-family:var(--mono);margin-top:3px;">${planLabel}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;">
      <div style="background:rgba(18,21,32,.82);border:1px solid var(--line);border-radius:14px;padding:15px 10px;text-align:center;">
        <div style="font-size:22px;font-weight:700;color:#00e5d1;">${state.history.length}</div>
        <div style="font-size:10px;color:var(--muted2);font-family:var(--mono);text-transform:uppercase;margin-top:3px;">анализов</div>
      </div>
      <div style="background:rgba(18,21,32,.82);border:1px solid var(--line);border-radius:14px;padding:15px 10px;text-align:center;">
        <div style="font-size:22px;font-weight:700;color:#1fe084;">${goodCount}</div>
        <div style="font-size:10px;color:var(--muted2);font-family:var(--mono);text-transform:uppercase;margin-top:3px;">заходить</div>
      </div>
      <div style="background:rgba(18,21,32,.82);border:1px solid var(--line);border-radius:14px;padding:15px 10px;text-align:center;">
        <div style="font-size:22px;font-weight:700;color:#ffc24b;">1</div>
        <div style="font-size:10px;color:var(--muted2);font-family:var(--mono);text-transform:uppercase;margin-top:3px;">дней с нами</div>
      </div>
    </div>

    <div style="background:rgba(18,21,32,.82);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;">${rows}</div>
    <div style="text-align:center;padding:10px 0;">${poweredBy()}</div>
  </div>`;
}

function renderShell() {
  const [topTitle, topSub] = topMeta();
  let content;
  switch (state.screen) {
    case 'input':   content = screenInput();   break;
    case 'loading': content = screenLoading(); break;
    case 'result':  content = screenResult();  break;
    case 'details': content = screenDetails(); break;
    case 'history': content = screenHistory(); break;
    case 'pro':     content = screenPro();     break;
    case 'profile': content = screenProfile(); break;
    default:        content = screenInput();
  }

  const nav = navConfig().map(n => `
    <button data-act="go" data-screen="${n.screen}" style="flex:1;cursor:pointer;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;color:${n.active ? '#00e5d1' : '#586079'};transition:color .2s;">
      <span style="width:24px;height:24px;">${n.icon}</span>
      <span style="font-size:10px;font-weight:600;font-family:var(--mono);">${n.label}</span>
    </button>`).join('');

  return `
  <div style="flex:1;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;gap:11px;padding:20px 18px 14px;">
      <div style="width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#00e5d1,#7c5cff);display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(0,229,209,.4);flex:none;">${LOGO_SVG}</div>
      <div style="flex:1;">
        <div style="font-size:15px;font-weight:700;letter-spacing:.2px;">${esc(topTitle)}</div>
        <div style="font-size:10.5px;color:#00e5d1;font-family:var(--mono);letter-spacing:1px;text-transform:uppercase;">${esc(topSub)}</div>
      </div>
      <button data-act="pro" style="cursor:pointer;border:1px solid rgba(255,194,75,.4);background:rgba(255,194,75,.1);color:#ffc24b;font-family:var(--mono);font-size:11px;font-weight:700;padding:7px 12px;border-radius:20px;display:flex;align-items:center;gap:5px;">★ PRO</button>
    </div>

    <div class="nq-scroll" style="flex:1;overflow-y:auto;padding:6px 18px 96px;">${content}</div>

    <div style="position:sticky;bottom:0;left:0;right:0;background:rgba(10,12,18,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:9px 8px 12px;">${nav}</div>
  </div>`;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = state.screen === 'onboarding' ? screenOnboarding() : renderShell();

  if (tg && tg.BackButton) {
    try {
      if (state.screen === 'details') tg.BackButton.show();
      else tg.BackButton.hide();
    } catch (e) {}
  }

  const input = document.getElementById('nq-query');
  if (input) {
    input.addEventListener('input', e => { state.query = e.target.value; });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });
  }
}

document.getElementById('app').addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.getAttribute('data-act');
  switch (act) {
    case 'start':        haptic(); setScreen('input'); break;
    case 'analyze':      analyze(); break;
    case 'example':      analyze(el.getAttribute('data-q')); break;
    case 'reset':        haptic(); reset(); break;
    case 'details':      haptic(); setScreen('details'); break;
    case 'back-result':  haptic(); setScreen('result'); break;
    case 'go':           haptic(); setScreen(el.getAttribute('data-screen')); break;
    case 'pro':          haptic(); setScreen('pro'); break;
    case 'activate-pro': activatePro(); break;
    case 'open-history': haptic(); openHistory(+el.getAttribute('data-idx')); break;
  }
});

if (tg && tg.BackButton) {
  try { tg.BackButton.onClick(() => { if (state.screen === 'details') setScreen('result'); }); } catch (e) {}
}

render();
</script>
</body>
</html>
